[package]
name = "bead-rs"
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
authors = ["Jed Arden <github@jedarden.com>"]
description = "Clean-room task coordination for agent fleets"
license = "Apache-2.0"
repository = "https://github.com/jedarden/bead-rs"
readme = "README.md"
keywords = ["agents", "cli", "issues", "sqlite", "task-tracking"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bead"
path = "src/main.rs"

[[bin]]
name = "generate-man-pages"
path = "src/bin/generate-man-pages.rs"

[dependencies]
aho-corasick = "1.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_mangen = "0.3.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
time = { version = ">=0.3.45, <0.3.46", features = ["formatting", "parsing"] }
rand = "0.8"
regex = "1.12"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
uuid = { version = "1.24.1", features = ["v4"] }
serial_test = "3.1"
tempfile = "3.27.0"
chrono = "0.4"
fs2 = "0.4.3"

[features]
default = []
attempt-resolution = []

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1"
serial_test = "3.1"
num_cpus = "1.16"

[[bench]]
name = "lifecycle"
harness = false

# Line tables keep file:line frames in panics and backtraces; variable and
# type-level DWARF was 76-85% of every dev/test binary and nobody read it
# (beadrs-e05c5e9f, 2026-09-23). One-off lane that needs full debug info:
# CARGO_PROFILE_DEV_DEBUG=2 cargo <cmd>.
[profile.dev]
debug = "line-tables-only"

# Claim workspace-root status explicitly. Without a [workspace] table cargo
# walks up from this manifest looking for one to join, and any stray
# Cargo.toml in a parent directory is then an error ("current package
# believes it's in a workspace when it's not") rather than scenery. That is
# exactly how verification extractions under /tmp failed: debris from another
# project's flat extraction sat at /tmp/Cargo.toml (2026-09-10) and every
# clean gate of this crate died in ~30 ms with exit 101 before compiling a
# line, which the gate misread as a dependency on uncommitted files
# (beadrs-f473e6ac, 2026-09-26). An empty [workspace] makes this package its
# own workspace root — the single-member resolution, Cargo.lock and target
# layout are unchanged — so extraction location no longer matters.
[workspace]
