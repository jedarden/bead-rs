[package]
name = "bead-rs"
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
authors = ["Jed Arden <github@jedarden.com>"]
description = "Clean-room task coordination for agent fleets"
license = "Apache-2.0"
repository = "https://github.com/jedarden/bead-rs"
readme = "README.md"
keywords = ["agents", "cli", "issues", "sqlite", "task-tracking"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bead"
path = "src/main.rs"

[[bin]]
name = "generate-man-pages"
path = "src/bin/generate-man-pages.rs"

[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
clap_mangen = "=0.2.20"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
rand = "0.8"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
uuid = { version = "=1.8.0", features = ["v4"] }
serial_test = "3.1"
tempfile = "=3.12.0"
chrono = "0.4"
fs2 = "=0.4.3"

[dev-dependencies]
tempfile = "=3.12.0"
assert_cmd = "=2.0.16"
predicates = "3.1"
serial_test = "3.1"
num_cpus = "1.16"

[[bench]]
name = "lifecycle"
harness = false
