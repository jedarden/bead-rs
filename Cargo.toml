[package]
name = "bead-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Jed Arden <github@jedarden.com>"]
description = "Clean-room task coordination for agent fleets"
license = "Apache-2.0"
repository = "https://github.com/jedarden/bead-rs"
readme = "README.md"
keywords = ["agents", "cli", "issues", "sqlite", "task-tracking"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bead"
path = "src/main.rs"

[[bin]]
name = "generate-man-pages"
path = "src/bin/generate-man-pages.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_mangen = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
rand = "0.8"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
serial_test = "3.1"

[dev-dependencies]
tempfile = "3.12"
assert_cmd = "2.0"
predicates = "3.1"
serial_test = "3.1"
num_cpus = "1.16"

[[bench]]
name = "lifecycle"
harness = false

